name: Maxi Mail

on:
  schedule:
    - cron: "17 * * * *"   # jede Stunde, Skript entscheidet ob gesendet wird
  workflow_dispatch:
    inputs:
      force:
        description: "Testmail an dich selbst senden"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node send-mail.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAXI_EMAIL: ${{ secrets.MAXI_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          FORCE: ${{ inputs.force || false }}
      - name: Status speichern
        run: |
          git config user.name "maxi-timer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last-sent.txt
          git diff --cached --quiet || (git commit -m "Mail gesendet" && git push)
