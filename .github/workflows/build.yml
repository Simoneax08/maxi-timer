name: Build Maxi Timer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build index.html aus src/
        run: node scripts/build.mjs

      - name: Commit und Push, wenn sich index.html geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "build: index.html aus src/ [skip ci]"
            git push
          fi
